name: Scheduled Push Cron

# iPhone 탭이 닫혀 있어도 키워드/정기 푸시가 나가도록
# /api/send-scheduled-push 를 주기적으로 호출합니다.
on:
  schedule:
    # 5분 호출은 cron-job.org가 담당한다.
    # GitHub 예비 호출은 정각을 피한다. 정각은 예약이 빠지기 쉽다.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

jobs:
  send-scheduled-push:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger NewsFlash scheduled push
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "GitHub Secrets에 CRON_SECRET이 없습니다. Vercel의 CRON_SECRET과 같은 값을 넣어주세요."
            exit 1
          fi
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --max-time 55 \
            "https://newsflash-web-seven.vercel.app/api/send-scheduled-push"
